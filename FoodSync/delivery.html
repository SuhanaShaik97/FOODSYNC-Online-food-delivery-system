<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FOODSYNC — Delivery partner</title>
<link rel="stylesheet" href="css/style.css" />
<style>
  .page-body { padding: 32px 0 80px; }
  .col-heading { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
  .col-heading h2 { font-size: 18px; }
  .count-pill {
    background: var(--plum); color: #fff; font-size: 12px; font-weight: 700;
    border-radius: 100px; padding: 2px 9px;
  }
  .two-col {
    display: grid; grid-template-columns: 1fr 1fr; gap: 32px;
  }
  @media (max-width: 820px) { .two-col { grid-template-columns: 1fr; } }

  .delivery-card { padding: 16px 18px; margin-bottom: 12px; }
  .delivery-card .items { font-size: 13.5px; color: var(--muted); margin: 4px 0; }
  .delivery-card .meta { font-size: 12.5px; color: var(--muted); margin-bottom: 10px; }
  .delivery-actions { display:flex; gap:8px; }
</style>
</head>
<body>

<nav class="topnav">
  <div class="container">
    <div class="flex" style="align-items:center;">
      <span class="brand">FOODSYNC<span style="color:var(--marigold)">.</span></span>
      <span class="role-tag">Delivery Partner</span>
    </div>
    <div class="nav-right">
      <span id="welcomeName" style="font-size:14px;color:#D8C9DB;"></span>
      <button class="btn-ghost" onclick="logout()">Log out</button>
    </div>
  </div>
</nav>

<div class="container page-body">
  <h1 class="section-title">On the road</h1>
  <p class="section-sub">Review pickup requests from restaurants, accept or reject them, then complete the delivery.</p>

  <div class="two-col">
    <div>
      <div class="col-heading">
        <h2>Ready for pickup</h2>
        <span class="count-pill" id="availableCount">0</span>
      </div>
      <div id="availableContainer"></div>
    </div>
    <div>
      <div class="col-heading">
        <h2>My deliveries</h2>
        <span class="count-pill" id="mineCount">0</span>
      </div>
      <div id="mineContainer"></div>
    </div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/delivery.js"></script>
</body>
</html>
